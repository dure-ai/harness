[project]
name = "t5-harness"
version = "0.1.0"
description = "Memory evaluation harness"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
gen = [
    "anthropic>=1.15",
    "openai>=3.35",
    "pyarrow>=26.0",
    "huggingface_hub>=2.2",
]
# Engines written to the cortex-mem port (harness.core_bridge); baselines and OSS engines do not need it.
core = [
    "cortex-mem",
]

[tool.uv.sources]
cortex-mem = { git = "https://github.com/dure-ai/core", rev = "e125f9b2b76b1ea347993fa42f98a30b710d3c1d" }

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "anthropic>=1.15",
    "openai>=3.35",
    "pyarrow>=26.0",
    "huggingface_hub>=2.2",
    "ruff==0.17.4",
    "basedpyright==1.40.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Import sorting wraps at this width. Line length itself (E501) is not checked; a few older lines
# are longer.
line-length = 120

[tool.ruff.lint]
# D: docstrings. F: pyflakes. E4/E7/E9: the pycodestyle errors that are not layout. I: import order.
# B: bugbear. UP: pyupgrade. SIM: simplifications.
select = ["D", "F", "E4", "E7", "E9", "I", "B", "UP", "SIM"]
ignore = [
    "D105", "D107",  # __init__ and dunder methods are documented in the class docstring (Google style).
    "B027",  # BaseEngine.tick and flush are optional hooks with a no-op default, not abstract methods.
    "SIM108",  # an if/else block often reads better than a long or nested conditional expression.
]

[tool.ruff.lint.isort]
known-first-party = ["harness", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.basedpyright]
# CI fails on errors and on any warning that is not in .basedpyright/baseline.json. A fixed
# warning drops out of the baseline on the next run; accept a new one with a targeted
# `# pyright: ignore[rule]`, not a new baseline entry.
failOnWarnings = true
