[project]
name = "t5-harness"
version = "0.1.0"
description = "Memory evaluation harness"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
gen = [
    "anthropic>=1.15",
    "openai>=3.35",
    "pyarrow>=26.0",
    "huggingface_hub>=2.2",
]
# Engines written to the cortex-mem port (harness.core_bridge); baselines and OSS engines do not need it.
core = [
    "cortex-mem",
]

[tool.uv.sources]
cortex-mem = { git = "https://github.com/dure-ai/core", rev = "daaba07de2adacb83e1bdfcd2701c49763602521" }

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "anthropic>=1.15",
    "openai>=3.35",
    "pyarrow>=26.0",
    "huggingface_hub>=2.2",
    "ruff==0.17.4",
    "basedpyright==1.40.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["D"]
# __init__ and dunder methods are documented in the class docstring (Google style).
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.basedpyright]
# CI fails on errors only; the existing warnings are kept visible but do not fail the run.
failOnWarnings = false
