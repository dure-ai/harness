[project]
name = "t5-harness"
version = "0.1.0"
description = "Memory evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
harness = "harness.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["D"]
# __init__ and dunder methods are documented in the class docstring (Google style).
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
