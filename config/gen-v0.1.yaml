# Scenario generation settings. Not part of the eval config hash: generation never affects scores.
provider: anthropic
model: claude-opus-5-5
effort: medium
temperature: 0.2  # openai only
# api_key_env: ANTHROPIC_API_KEY  # env var holding the key, either provider; unset = SDK default
max_output_tokens: 16000
timeout_s: 300       # per request: a full 16000-token reply without streaming takes up to ~5 min
max_retries: 2       # SDK retries; worst case per request is timeout_s * (max_retries + 1) = 15 min
token_param: max_completion_tokens  # openai only: max_completion_tokens | max_tokens | none
prompt_version: gen-v0.4
max_candidates_per_trace: 5
license_allowlist: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, MPL-2.0, Unlicense]
# Answer cues: never in event bodies or probe queries. A fact's own markers and `code spans` are skipped.
banned_cue_words: [outdated, "no longer", rumor, unverified, fake, deprecated, "false", "no longer true",
  legacy, obsolete, superseded, stale, incorrect, wrong, retired, "replaced by", "not valid anymore"]
min_quote_chars: 8   # a candidate quote needs this many non-space characters and two words
