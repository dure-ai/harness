facts:
  f_a:
    text: In the beets web plugin (beetsplug/web/__init__.py), QueryConverter splits
      URL queries on '/' and turns backslashes into os.sep, so path queries can use
      backslashes as path separators in URLs, but this also breaks regex queries that
      contain backslashes such as \d or \w.
    valid_from: null
    valid_until: null
    valid: true
    conditions:
      component: web plugin
    fix: null
    markers:
    - QueryConverter
    - os.sep
  f_b:
    text: On the beta build of the web plugin, /item/query also accepts the whole
      query through a q parameter (/item/query?q=...), and a percent-encoded backslash
      passed that way reaches the regex matcher untouched.
    valid_from: null
    valid_until: null
    valid: true
    conditions:
      component: beta
    fix: null
    markers:
    - query?q=
    - q parameter
