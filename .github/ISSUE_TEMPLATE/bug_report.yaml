name: Bug report
description: Something in the harness errors out or gives a wrong result
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command, the scenario set, and the engines you passed.
      placeholder: |
        uv run harness run --scenarios scenarios/examples --include-drafts --out runs
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full error message or the relevant part of the report. This is rendered as a code block.
      render: text
    validations:
      required: false

  - type: input
    id: commit
    attributes:
      label: Commit
      description: The harness commit you ran (see `git rev-parse --short HEAD`).
      placeholder: e.g. f827138
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system (see `uv run python --version` and `uname -orsm`).
      placeholder: e.g. Python 3.12.6, macOS 15 arm64
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as a suspected cause or related issues and PRs.
    validations:
      required: false
